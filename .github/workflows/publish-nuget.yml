name: Publish NuGet

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version (must match FrostUI.csproj, e.g. 1.0.0)"
        required: true
        default: "1.0.0"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Pack
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) { $version = "1.0.0" }
          dotnet pack src/FrostUI/FrostUI.csproj -c Release -o artifacts -p:Version=$version

      # Trusted Publishing: exchange the GitHub OIDC token for a short-lived NuGet key.
      # Requires a nuget.org trusted publishing policy for:
      #   owner TeaBoss / repo TeaBoss-Developer/FrostUI / workflow publish-nuget.yml
      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: TeaBoss

      - name: Push to nuget.org
        shell: pwsh
        run: |
          Get-ChildItem artifacts/*.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
          Get-ChildItem artifacts/*.snupkg -ErrorAction SilentlyContinue | ForEach-Object {
            dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
